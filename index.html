<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectravax Hub</title>
  <!-- Font Awesome 6 (free) for clipboard icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- JetBrains Mono via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0 !important;   /* force sharp corners everywhere */
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      color: #eaeef3;
      transition: background 0.2s ease, color 0.2s ease;
      padding: 1.5rem;
      margin: 0;
    }

    /* main card – no rounded corners, border instead of shadow */
    .hub-card {
      max-width: 780px;
      width: 100%;
      background: #131a22;
      border: 1px solid #2a323c;
      padding: 2.2rem 2.5rem 2.8rem;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    /* header row: title + theme switcher */
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem 0.5rem;
      margin-bottom: 0.5rem;
    }

    .main-title {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    /* theme switcher — three buttons */
    .theme-switcher {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid #3e4856;
      color: #bcc5d0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
      background: #1e2630;
      border-radius: 0 !important;
    }

    .theme-btn:hover {
      background: #2c3644;
      border-color: #6b7b8f;
    }

    .theme-btn.active {
      background: #2f3a4a;
      border-color: #b0c0d0;
      color: #ffffff;
      box-shadow: inset 0 0 0 1px #6a7e94;
    }

    /* orange theme active state override (applied via JS) */
    body.orange-theme .theme-btn.active-orange {
      background: #d97c2b;
      border-color: #d97c2b;
      color: #0b0e14;
      box-shadow: inset 0 0 0 1px #f5a45c;
    }

    /* subline with left border */
    .subline {
      font-style: italic;
      font-size: 1rem;
      padding-left: 0.9rem;
      border-left: 4px solid #d97c2b;
      margin: 0.25rem 0 1.5rem 0;
      color: #bccad9;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* decoration bar: three colored blocks */
    .decoration-bar {
      display: flex;
      gap: 0;
      margin: 1.2rem 0 0.6rem 0;
      border: 1px solid #3a4452;
      background: #1a222c;
      height: 16px;
    }

    .decoration-bar .block {
      flex: 1;
      height: 100%;
    }

    .block-yellow { background: #f7c948; }
    .block-green  { background: #4caf7a; }
    .block-red    { background: #d95b5b; }

    /* "Specting" label — orange highlight */
    .specting-label {
      font-size: 1.1rem;
      margin: 0.2rem 0 0.6rem 0;
      letter-spacing: 0.02em;
      color: #bccad9;
    }

    .specting-label .highlight {
      color: #d97c2b;
      font-weight: 700;
    }

    /* key display area */
    .key-area {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      margin: 1rem 0 1.2rem 0;
      padding: 0.9rem 1.2rem;
      background: #0f161e;
      border: 1px solid #2d3846;
      transition: border-color 0.2s;
    }

    .key-text {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #dfe7f0;
      word-break: break-all;
      flex: 1;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      border: 1px solid #3d4a5a;
      color: #d0dbe8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      background: #1c2531;
      border-radius: 0 !important;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .copy-btn i {
      font-size: 0.9rem;
    }

    .copy-btn:hover {
      background: #2b3648;
      border-color: #5e7086;
      color: #ffffff;
    }

    .copy-btn:active {
      background: #3b4a60;
    }

    /* toast notification */
    .toast {
      visibility: hidden;
      min-width: 140px;
      background: #1e293b;
      color: #d6e2f0;
      border: 1px solid #4b5c70;
      padding: 0.5rem 1.2rem;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      display: inline-block;
      margin-top: 0.6rem;
      transition: opacity 0.2s, visibility 0.2s;
      opacity: 0;
      border-radius: 0 !important;
    }

    .toast.show {
      visibility: visible;
      opacity: 1;
    }

    /* ---------- THEME VARIANTS (dark is default) ---------- */
    /* Light theme */
    body.light-theme {
      background: #e9edf2;
      color: #1a212b;
    }
    body.light-theme .hub-card {
      background: #f2f6fc;
      border-color: #b6c2d0;
    }
    body.light-theme .subline {
      color: #2c3a4a;
      border-left-color: #d97c2b;
    }
    body.light-theme .decoration-bar {
      border-color: #b0becd;
      background: #dbe2ec;
    }
    body.light-theme .specting-label {
      color: #1f2a38;
    }
    body.light-theme .key-area {
      background: #e2e9f2;
      border-color: #b0c0d2;
    }
    body.light-theme .key-text {
      color: #141c28;
    }
    body.light-theme .copy-btn {
      background: #d4deea;
      border-color: #98aabc;
      color: #1a2535;
    }
    body.light-theme .copy-btn:hover {
      background: #c4d0e0;
      border-color: #7a8ea6;
      color: #0b121c;
    }
    body.light-theme .theme-btn {
      background: #d9e2ed;
      border-color: #9aadb9;
      color: #1d2938;
    }
    body.light-theme .theme-btn:hover {
      background: #c4d2e2;
      border-color: #7b8fa5;
    }
    body.light-theme .theme-btn.active {
      background: #b8c8dc;
      border-color: #6c7f96;
      color: #0f1a26;
    }
    body.light-theme .toast {
      background: #d7e1ed;
      border-color: #8b9fb2;
      color: #101b28;
    }

    /* Orange theme: dark background + orange accents */
    body.orange-theme {
      background: #0b0e14;
      color: #eaeef3;
    }
    body.orange-theme .hub-card {
      background: #131a22;
      border-color: #d97c2b;
    }
    body.orange-theme .subline {
      border-left-color: #d97c2b;
    }
    body.orange-theme .decoration-bar {
      border-color: #d97c2b;
      background: #1e2733;
    }
    body.orange-theme .specting-label .highlight {
      color: #d97c2b;
    }
    body.orange-theme .key-area {
      background: #10171f;
      border-color: #d97c2b;
    }
    body.orange-theme .key-text {
      color: #f0f4fa;
    }
    body.orange-theme .copy-btn {
      background: #1c2533;
      border-color: #d97c2b;
      color: #f0e8dc;
    }
    body.orange-theme .copy-btn:hover {
      background: #2e3a4e;
      border-color: #e8923f;
      color: #ffffff;
    }
    body.orange-theme .theme-btn {
      background: #1c2533;
      border-color: #6b5f4a;
      color: #d4cfc5;
    }
    body.orange-theme .theme-btn:hover {
      background: #2d3a4d;
      border-color: #d97c2b;
    }
    body.orange-theme .theme-btn.active {
      background: #2f3a4a;
      border-color: #d97c2b;
      color: #f0e8dc;
    }
    body.orange-theme .theme-btn.active-orange {
      background: #d97c2b;
      border-color: #d97c2b;
      color: #0b0e14;
      box-shadow: inset 0 0 0 1px #f5a45c;
    }
    body.orange-theme .toast {
      background: #1e2733;
      border-color: #d97c2b;
      color: #f0e8dc;
    }

    /* utility */
    .mt-1 { margin-top: 0.25rem; }
    .flex { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  </style>
</head>
<body>

<div class="hub-card" id="hubCard">

  <!-- header: title + theme switcher -->
  <div class="hub-header">
    <h1 class="main-title">Spectravax Hub</h1>
    <div class="theme-switcher">
      <button class="theme-btn active" data-theme="dark" id="themeDark">Dark</button>
      <button class="theme-btn" data-theme="light" id="themeLight">Light</button>
      <button class="theme-btn" data-theme="orange" id="themeOrange">Orange</button>
    </div>
  </div>

  <!-- subline with left border -->
  <div class="subline">Here's your key, very easy like I said.</div>

  <!-- decoration bar: yellow, green, red -->
  <div class="decoration-bar">
    <span class="block block-yellow"></span>
    <span class="block block-green"></span>
    <span class="block block-red"></span>
  </div>

  <!-- "Specting" label with orange highlight -->
  <div class="specting-label">
    <span class="highlight">Specting</span>
  </div>

  <!-- key display + copy button -->
  <div class="key-area">
    <span class="key-text" id="keyDisplay">SP3C-TR4V-4X-K3Y</span>
    <button class="copy-btn" id="copyBtn">
      <i class="fas fa-clipboard"></i> Copy Key
    </button>
  </div>

  <!-- toast notification -->
  <div id="toastMsg" class="toast">copied!</div>

</div>

<script>
  (function() {
    const body = document.body;
    const keyText = document.getElementById('keyDisplay');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toastMsg');

    // theme buttons
    const themeDark = document.getElementById('themeDark');
    const themeLight = document.getElementById('themeLight');
    const themeOrange = document.getElementById('themeOrange');
    const allThemeBtns = [themeDark, themeLight, themeOrange];

    // ----- helper: set active class on theme buttons -----
    function setActiveThemeButton(activeBtn) {
      allThemeBtns.forEach(btn => btn.classList.remove('active', 'active-orange'));
      activeBtn.classList.add('active');
      // for orange we add extra class for specific styling
      if (activeBtn === themeOrange) {
        activeBtn.classList.add('active-orange');
      }
    }

    // ----- apply theme -----
    function setTheme(theme) {
      // remove all theme classes
      body.classList.remove('dark-theme', 'light-theme', 'orange-theme');
      // add the selected one (dark is default, but we keep it explicit)
      if (theme === 'dark') {
        body.classList.add('dark-theme');
        setActiveThemeButton(themeDark);
      } else if (theme === 'light') {
        body.classList.add('light-theme');
        setActiveThemeButton(themeLight);
      } else if (theme === 'orange') {
        body.classList.add('orange-theme');
        setActiveThemeButton(themeOrange);
      }
      // ensure the hub card gets the border treatment (no extra needed)
    }

    // ----- initial: dark (default) -----
    setTheme('dark');

    // event listeners for theme buttons
    themeDark.addEventListener('click', function(e) {
      e.preventDefault();
      setTheme('dark');
    });
    themeLight.addEventListener('click', function(e) {
      e.preventDefault();
      setTheme('light');
    });
    themeOrange.addEventListener('click', function(e) {
      e.preventDefault();
      setTheme('orange');
    });

    // ----- copy to clipboard -----
    async function copyKey() {
      const key = keyText.textContent.trim();
      try {
        await navigator.clipboard.writeText(key);
        showToast('copied!');
      } catch (err) {
        // fallback
        const textArea = document.createElement('textarea');
        textArea.value = key;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('copied!');
        } catch (fallbackErr) {
          alert('Could not copy key. Please copy manually.');
        }
        document.body.removeChild(textArea);
      }
    }

    function showToast(message) {
      toast.textContent = message || 'copied!';
      toast.classList.add('show');
      clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    copyBtn.addEventListener('click', function(e) {
      e.preventDefault();
      copyKey();
    });

    // if user clicks on key area, we could copy, but we keep explicit button
    // extra safety: prevent double copy if click on key? no need.

    // after theme switch, ensure orange button active class if needed (already handled)
    // also ensure no rounding (border-radius:0 set globally)

    // tiny fix: if orange theme, active-orange class is set via setActiveThemeButton
    // but when we switch from orange to dark/light, we remove active-orange
    // in setActiveThemeButton we remove all active and active-orange from all buttons.
    // all good.

    // extra: ensure the toast inherits border-radius 0 (global * does it)

  })();
</script>
</body>
</html>
