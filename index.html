<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rscripts.net search · ScriptBlox style</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f4f6fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app {
      max-width: 1300px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      background: white;
      padding: 1rem 2rem;
      border-radius: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo span {
      font-weight: 400;
      color: #64748b;
      font-size: 0.9rem;
      -webkit-text-fill-color: #64748b;
      background: none;
    }

    .badge {
      background: #eef2ff;
      color: #4f46e5;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge i {
      font-size: 0.7rem;
    }

    .search-card {
      background: white;
      border-radius: 2rem;
      padding: 1.5rem 2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 60px;
      padding: 0 1.2rem;
      transition: 0.2s;
      border: 2px solid transparent;
    }
    .search-box:focus-within {
      background: white;
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }
    .search-box i {
      color: #94a3b8;
      font-size: 1rem;
    }
    .search-box input {
      border: none;
      background: transparent;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      width: 100%;
      outline: none;
      font-weight: 450;
    }
    .search-box input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .search-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: #f1f5f9;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #1e293b;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .btn-primary:hover {
      background: #4338ca;
      transform: scale(0.97);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #e2e8f0;
    }
    .btn-outline:hover {
      background: #f8fafc;
    }
    .btn i {
      font-size: 0.9rem;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .results-header h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .results-header h2 small {
      font-weight: 400;
      font-size: 0.9rem;
      color: #64748b;
    }

    .script-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .script-card {
      background: white;
      border-radius: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      transition: 0.2s;
      border: 1px solid #f0f2f6;
      display: flex;
      flex-direction: column;
    }
    .script-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.08);
      border-color: #e2e8f0;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .card-title i {
      color: #818cf8;
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }
    .card-game {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-game i {
      color: #94a3b8;
      font-size: 0.7rem;
    }
    .card-game a {
      color: #4f46e5;
      text-decoration: none;
    }
    .card-game a:hover {
      text-decoration: underline;
    }

    .card-desc {
      color: #334155;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #64748b;
      border-top: 1px solid #f1f5f9;
      padding-top: 0.9rem;
      margin-top: 0.2rem;
      flex-wrap: wrap;
      gap: 4px;
    }
    .card-meta .stats {
      display: flex;
      gap: 12px;
    }
    .card-meta .stats span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-meta .stats i {
      font-size: 0.7rem;
    }

    .risk-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .risk-safe {
      background: #dcfce7;
      color: #166534;
    }
    .risk-low {
      background: #fef9c3;
      color: #854d0e;
    }
    .risk-medium {
      background: #fee2e2;
      color: #991b1b;
    }
    .risk-unknown {
      background: #e9edf2;
      color: #64748b;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: #64748b;
      grid-column: 1/-1;
    }
    .empty-state i {
      font-size: 3rem;
      color: #cbd5e1;
      margin-bottom: 1rem;
    }
    .empty-state h3 {
      font-weight: 500;
      color: #1e293b;
    }

    .footer-note {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      border-top: 1px solid #e9edf2;
      padding-top: 2rem;
    }
    .footer-note a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 500;
    }

    .shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e9edf2 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 12px;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .loading-card {
      height: 200px;
      border-radius: 1.5rem;
      background: white;
      padding: 1.5rem;
      border: 1px solid #f0f2f6;
    }
    .loading-card .line {
      height: 12px;
      margin-bottom: 10px;
      border-radius: 40px;
      background: #f1f5f9;
    }

    @media (max-width: 640px) {
      .header { flex-direction: column; align-items: stretch; text-align: center; }
      .search-card { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <header class="header">
    <div class="logo">
      <h1>📜 rscripts <span>· search</span></h1>
    </div>
    <div class="badge">
      <i class="fas fa-shield-alt"></i> Rscripts API · live
    </div>
  </header>

  <div class="search-card">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search scripts, games, or creators…" value="autofarm" />
    </div>
    <div class="search-actions">
      <button class="btn btn-primary" id="searchBtn"><i class="fas fa-arrow-right"></i> Search</button>
      <button class="btn btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset</button>
    </div>
  </div>

  <div class="results-header">
    <h2 id="resultTitle">🔍 Scripts <small id="resultCount"></small></h2>
    <span style="font-size:0.8rem; color:#94a3b8;">
      <i class="fas fa-code"></i> Powered by Rscripts.net
    </span>
  </div>

  <div id="scriptGrid" class="script-grid">
    <!-- cards rendered by JS -->
  </div>

  <div class="footer-note">
    <i class="fas fa-database"></i> Data from 
    <a href="https://api.rscripts.net/v1/search" target="_blank">Rscripts API</a> · 
    <a href="https://rscripts.net/docs/api" target="_blank">API docs</a>
  </div>
</div>

<script>
  (function() {
    // ---------- YOUR API KEY ----------
    const API_KEY = 'rsc_live_JelXNkd8gAbBqAKoM5p3tYSevOtkqdxC';

    const API_URL = 'https://api.rscripts.net/v1/search';

    // DOM refs
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scriptGrid = document.getElementById('scriptGrid');
    const resultCount = document.getElementById('resultCount');

    // ---------- helpers ----------
    function buildSearchUrl(query, limit = 12) {
      const url = new URL(API_URL);
      url.searchParams.set('q', query.trim());
      url.searchParams.set('index', 'scripts');
      url.searchParams.set('limit', String(limit));
      url.searchParams.set('page', '1');
      return url.toString();
    }

    function getRiskBadge(risk) {
      if (!risk) {
        return '<span class="risk-badge risk-unknown">unknown</span>';
      }
      const score = risk.score;
      if (score === undefined || score === null) {
        return '<span class="risk-badge risk-unknown">unknown</span>';
      }
      if (score <= 2) {
        return `<span class="risk-badge risk-safe">✓ Safe</span>`;
      } else if (score <= 4) {
        return `<span class="risk-badge risk-low">⚠ Low</span>`;
      } else {
        return `<span class="risk-badge risk-medium">🔶 Risk</span>`;
      }
    }

    function formatNum(n) {
      if (!n && n !== 0) return '0';
      if (n >= 1000) return (n/1000).toFixed(1) + 'k';
      return String(n);
    }

    function renderScripts(data) {
      const scripts = data?.scripts || [];
      const total = data?.meta?.pagination?.scripts?.total || 0;

      if (total > 0) {
        resultCount.textContent = `(${total} results)`;
      } else {
        resultCount.textContent = '';
      }

      if (scripts.length === 0) {
        scriptGrid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-box-open"></i>
            <h3>No scripts found</h3>
            <p style="color:#94a3b8; margin-top:0.3rem;">Try a different query.</p>
          </div>
        `;
        return;
      }

      let html = '';
      scripts.forEach(script => {
        const title = script.title || 'Untitled';
        const gameTitle = script.game?.title || 'Roblox';
        const placeId = script.game?.placeId || '';
        const gameUrl = script.game?.robloxUrl || `https://www.roblox.com/games/${placeId}`;
        const desc = script.description || 'No description provided.';
        const views = formatNum(script.views);
        const likes = formatNum(script.likes);
        const rawUrl = script.rawScript || '#';
        const riskBadge = getRiskBadge(script.risk);
        const creator = script.creator?.username || 'unknown';

        html += `
          <div class="script-card">
            <div class="card-title">
              <i class="fas fa-file-code"></i>
              ${title}
            </div>
            <div class="card-game">
              <i class="fas fa-gamepad"></i>
              <a href="${gameUrl}" target="_blank">${gameTitle}</a>
              ${placeId ? `<span style="color:#94a3b8;font-size:0.7rem;">#${placeId}</span>` : ''}
            </div>
            <div class="card-desc">${desc}</div>
            <div class="card-meta">
              <div class="stats">
                <span><i class="fas fa-eye"></i> ${views}</span>
                <span><i class="fas fa-thumbs-up"></i> ${likes}</span>
                <span><i class="fas fa-user"></i> ${creator}</span>
              </div>
              ${riskBadge}
            </div>
            <div style="margin-top:0.75rem; display:flex; gap:6px; font-size:0.75rem;">
              <a href="${rawUrl}" target="_blank" style="color:#4f46e5; text-decoration:none; background:#f1f5f9; padding:0.2rem 0.8rem; border-radius:40px;">
                <i class="fas fa-scroll"></i> raw script
              </a>
            </div>
          </div>
        `;
      });

      scriptGrid.innerHTML = html;
    }

    function showLoading() {
      resultCount.textContent = '…';
      let loadingHtml = '';
      for (let i = 0; i < 6; i++) {
        loadingHtml += `
          <div class="loading-card">
            <div class="line shimmer" style="width:70%;"></div>
            <div class="line shimmer" style="width:40%;"></div>
            <div class="line shimmer" style="width:90%; margin-top:12px;"></div>
            <div class="line shimmer" style="width:50%; margin-top:12px;"></div>
          </div>
        `;
      }
      scriptGrid.innerHTML = loadingHtml;
    }

    async function performSearch(query) {
      if (!query || query.trim() === '') {
        scriptGrid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search" style="font-size:2rem;"></i>
            <h3>Enter a search term</h3>
            <p style="color:#94a3b8;">e.g. "autofarm", "blox fruits", "inf yield"</p>
          </div>
        `;
        resultCount.textContent = '';
        return;
      }

      showLoading();

      try {
        const url = buildSearchUrl(query);
        const headers = {
          'Authorization': `Bearer ${API_KEY}`,
          'Accept': 'application/json',
        };

        const response = await fetch(url, { headers });
        if (!response.ok) {
          let errMsg = `API error ${response.status}`;
          try {
            const errJson = await response.json();
            if (errJson.error?.message) errMsg = errJson.error.message;
          } catch (_) {}
          throw new Error(errMsg);
        }

        const json = await response.json();
        if (json.success === false) {
          throw new Error(json.error?.message || 'Unknown API error');
        }

        renderScripts(json.data || { scripts: [], meta: {} });
      } catch (err) {
        console.error('Search error:', err);
        scriptGrid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
            <h3>Something went wrong</h3>
            <p style="color:#94a3b8; max-width:400px; margin:0 auto;">
              ${err.message || 'Could not fetch scripts. Check your API key or network.'}
            </p>
          </div>
        `;
        resultCount.textContent = '⚠️ error';
      }
    }

    // ---------- event binding ----------
    function handleSearch() {
      const query = searchInput.value.trim();
      performSearch(query);
    }

    searchBtn.addEventListener('click', handleSearch);

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSearch();
      }
    });

    resetBtn.addEventListener('click', () => {
      searchInput.value = '';
      performSearch('');
    });

    // ---------- initial load ----------
    setTimeout(() => {
      if (searchInput.value.trim()) {
        performSearch(searchInput.value.trim());
      } else {
        performSearch('autofarm');
      }
    }, 100);
  })();
</script>
</body>
</html>
