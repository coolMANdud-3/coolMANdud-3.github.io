<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>key · particles</title>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', 'Helvetica', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0c0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ----- particle canvas (fixed) ----- */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    /* ----- main card (glass) ----- */
    .card {
      position: relative;
      z-index: 10;
      max-width: 780px;
      width: 100%;
      background: rgba(18, 24, 38, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 3rem 2rem 2rem 3rem;
      padding: 2.5rem 2rem 2.8rem;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.03);
      text-align: center;
    }

    /* ----- headline ----- */
    .headline {
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 8vw, 3.4rem);
      letter-spacing: -0.02em;
      color: #f0f4ff;
      text-shadow: 0 4px 20px rgba(0, 20, 80, 0.5);
      margin-bottom: 0.3rem;
      line-height: 1.2;
    }

    .subhead {
      font-family: 'Arial', sans-serif;
      font-weight: 400;
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      color: #a3b3d9;
      margin-bottom: 2.4rem;
      letter-spacing: 0.02em;
      opacity: 0.9;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
      padding-bottom: 0.6rem;
      display: inline-block;
    }

    /* ----- key box (frame) ----- */
    .key-box {
      background: rgba(10, 14, 26, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 2.2rem 1.4rem 1.4rem 2.2rem;
      padding: 1rem 1.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6), 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.15s;
      margin-top: 0.4rem;
    }

    .key-box:hover {
      border-color: rgba(200, 215, 255, 0.15);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6), 0 10px 32px rgba(0, 40, 120, 0.3);
    }

    /* left: label + word */
    .key-label-group {
      display: flex;
      align-items: center;
      gap: 0.5rem 1.2rem;
      flex-wrap: wrap;
      flex: 1 1 160px;
    }

    .copy-label {
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #8f9fc7;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.2rem 1rem 0.2rem 1.2rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(2px);
      white-space: nowrap;
    }

    .key-word {
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      font-size: clamp(1.3rem, 4vw, 2rem);
      color: #d6e2ff;
      letter-spacing: 0.03em;
      background: linear-gradient(135deg, #eef4ff, #c0d0f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(70, 130, 255, 0.2);
      word-break: break-word;
      cursor: pointer;
    }

    /* right: copy button + feedback */
    .key-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #b7c9f0;
      font-family: 'Arial', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.5rem 1.3rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.03em;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(30, 50, 90, 0.25);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: rgba(60, 100, 200, 0.2);
      border-color: rgba(180, 210, 255, 0.3);
      color: #e8f0ff;
      transform: scale(1.01);
      box-shadow: 0 4px 12px rgba(0, 30, 120, 0.3);
    }

    .copy-btn:active {
      transform: scale(0.97);
      background: rgba(30, 70, 180, 0.3);
    }

    .copy-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .copy-feedback {
      font-size: 0.85rem;
      color: #7dab7d;
      min-width: 24px;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .copy-feedback svg {
      width: 20px;
      height: 20px;
      stroke: #7dab7d;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ----- decoration (green-yellow-red) ----- */
    .decoration-strip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      justify-content: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 30px;
      opacity: 0.9;
      box-shadow: 0 0 10px rgba(46, 139, 87, 0.3);
    }
    .dot:nth-child(1) { background: #4caf50; }
    .dot:nth-child(2) { background: #ffc107; }
    .dot:nth-child(3) { background: #e53e3e; }

    /* ----- extra subtitle ----- */
    .extra-sub {
      font-family: 'Arial', sans-serif;
      font-weight: 400;
      font-size: 0.85rem;
      color: #7b8bb0;
      margin-top: 0.1rem;
      opacity: 0.7;
    }

    /* ----- toast ----- */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 18, 34, 0.9);
      backdrop-filter: blur(8px);
      padding: 0.6rem 1.8rem;
      border-radius: 80px;
      color: #d4e2ff;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      letter-spacing: 0.02em;
    }
    .toast.show {
      opacity: 1;
    }

    /* ----- responsive ----- */
    @media (max-width: 520px) {
      .card {
        padding: 1.8rem 1.2rem 2rem;
        border-radius: 2.2rem 1.6rem 1.6rem 2.2rem;
      }
      .key-box {
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
        padding: 1.2rem 1rem;
      }
      .key-label-group {
        justify-content: center;
        gap: 0.3rem 0.8rem;
      }
      .key-actions {
        justify-content: center;
        margin-left: 0;
      }
      .copy-btn {
        padding: 0.5rem 1.2rem;
        font-size: 0.85rem;
      }
      .copy-label {
        font-size: 0.75rem;
        padding: 0.15rem 0.8rem;
      }
      .decoration-strip .dot {
        width: 10px;
        height: 10px;
      }
    }

    @media (max-width: 380px) {
      .headline {
        font-size: 1.6rem;
      }
      .key-word {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- particle canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- main card -->
  <div class="card">

    <!-- decoration: green-yellow-red (does nothing) -->
    <div class="decoration-strip">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- headline -->
    <div class="headline">I know you just came here just for the Key.</div>

    <!-- subtitle -->
    <div class="subhead">Well, then here's the key. It's just that simple</div>

    <!-- key box -->
    <div class="key-box">
      <div class="key-label-group">
        <span class="copy-label">copy word</span>
        <span class="key-word" id="keyWordDisplay">Specting</span>
      </div>
      <div class="key-actions">
        <button class="copy-btn" id="copyKeyBtn">
          <!-- clipboard icon (SVG, no emoji) -->
          <svg viewBox="0 0 24 24" stroke="currentColor">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
          </svg>
          key copy
        </button>
        <span class="copy-feedback" id="copyFeedback"></span>
      </div>
    </div>

    <div class="extra-sub">· the key is “Specting” ·</div>
  </div>

  <!-- toast -->
  <div id="toastMessage" class="toast">key copied: Specting</div>

  <script>
    (function() {
      // ----- particles -----
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const PARTICLE_COUNT = 180;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 2.5 + 1.2;
          this.speedMod = Math.random() * 1.6 + 0.2;
          this.vx = (Math.random() - 0.5) * 0.6 * this.speedMod;
          this.vy = (Math.random() - 0.5) * 0.6 * this.speedMod;
          this.alpha = Math.random() * 0.6 + 0.4;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0) this.x = width;
          if (this.x > width) this.x = 0;
          if (this.y < 0) this.y = height;
          if (this.y > height) this.y = 0;
          if (Math.random() < 0.01) {
            this.vx += (Math.random() - 0.5) * 0.08;
            this.vy += (Math.random() - 0.5) * 0.08;
            const maxSpeed = 0.9 * this.speedMod + 0.2;
            const sp = Math.hypot(this.vx, this.vy);
            if (sp > maxSpeed) {
              this.vx = (this.vx / sp) * maxSpeed;
              this.vy = (this.vy / sp) * maxSpeed;
            }
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
          ctx.fill();
          if (this.size > 2) {
            ctx.shadowColor = 'rgba(180, 210, 255, 0.2)';
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }
      initParticles();

      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        for (let p of particles) {
          p.update();
          p.draw();
        }
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          resize();
          initParticles();
        }, 200);
      });

      // ----- copy key (no emojis) -----
      const keyWord = 'Specting';
      const copyBtn = document.getElementById('copyKeyBtn');
      const feedbackEl = document.getElementById('copyFeedback');
      const toastEl = document.getElementById('toastMessage');

      const checkSvg = `
        <svg viewBox="0 0 24 24" stroke="currentColor">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      `;

      function showToast(msg) {
        toastEl.textContent = msg || 'key copied: Specting';
        toastEl.classList.add('show');
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 1800);
      }

      function copyKey() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(keyWord).then(() => {
            feedbackEl.innerHTML = checkSvg;
            setTimeout(() => { feedbackEl.innerHTML = ''; }, 1200);
            showToast('key copied: Specting');
          }).catch(() => {
            fallbackCopy(keyWord);
          });
        } else {
          fallbackCopy(keyWord);
        }
      }

      function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          feedbackEl.innerHTML = checkSvg;
          setTimeout(() => { feedbackEl.innerHTML = ''; }, 1200);
          showToast('key copied: Specting');
        } catch (e) {
          feedbackEl.innerHTML = '✗';
          setTimeout(() => { feedbackEl.innerHTML = ''; }, 1500);
          showToast('copy failed, try manually');
        }
        document.body.removeChild(textarea);
      }

      copyBtn.addEventListener('click', copyKey);
      document.getElementById('keyWordDisplay').addEventListener('click', copyKey);

      // click on key-box (but not button/feedback)
      document.querySelector('.key-box').addEventListener('click', (e) => {
        if (e.target.closest('.copy-btn')) return;
        if (e.target.closest('.copy-feedback')) return;
        copyKey();
      });

    })();
  </script>
</body>
</html>
