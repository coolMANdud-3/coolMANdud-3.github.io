<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rscripts.net search · ScriptBlox style</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ---------- DARK THEME ---------- */
    :root {
      --bg-primary: #0b0e14;
      --bg-secondary: #141a24;
      --bg-card: #1c2533;
      --bg-input: #1e2838;
      --bg-hover: #2a3648;
      --text-primary: #e8edf5;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #2a3648;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --shadow: 0 8px 24px rgba(0,0,0,0.4);
      --radius: 1.5rem;
      --transition: 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app {
      max-width: 1400px;
      width: 100%;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      background: var(--bg-secondary);
      padding: 1rem 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo span {
      font-weight: 400;
      color: var(--text-secondary);
      font-size: 0.9rem;
      -webkit-text-fill-color: var(--text-secondary);
      background: none;
    }

    .badge {
      background: #1e293b;
      color: var(--accent);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border-color);
    }

    /* search card */
    .search-card {
      background: var(--bg-secondary);
      border-radius: var(--radius);
      padding: 1.5rem 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      border: 1px solid var(--border-color);
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border-radius: 60px;
      padding: 0 1.2rem;
      transition: var(--transition);
      border: 2px solid transparent;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15);
    }
    .search-box i {
      color: var(--text-muted);
    }
    .search-box input {
      border: none;
      background: transparent;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      width: 100%;
      outline: none;
      color: var(--text-primary);
    }
    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1.4rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--bg-hover);
      transform: scale(0.97);
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
    }

    /* filters */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      align-items: center;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-group label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .filter-group select {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }
    .filter-group select:focus {
      border-color: var(--accent);
    }
    .filter-group select option {
      background: var(--bg-secondary);
    }

    .sort-badge {
      display: flex;
      gap: 4px;
      background: var(--bg-input);
      padding: 0.2rem 0.5rem;
      border-radius: 40px;
      border: 1px solid var(--border-color);
    }
    .sort-badge button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.2rem 0.6rem;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
    }
    .sort-badge button.active {
      background: var(--accent);
      color: white;
    }
    .sort-badge button:hover:not(.active) {
      color: var(--text-primary);
    }

    /* results */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .results-header h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .results-header h2 small {
      font-weight: 400;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* grid */
    .script-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .script-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: var(--transition);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .script-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .card-title i {
      color: var(--accent);
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }
    .card-game {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-game a {
      color: var(--accent);
      text-decoration: none;
    }
    .card-game a:hover {
      text-decoration: underline;
    }

    .card-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 0.75rem;
    }
    .card-tags .tag {
      background: var(--bg-input);
      color: var(--text-secondary);
      font-size: 0.65rem;
      padding: 0.15rem 0.6rem;
      border-radius: 40px;
      border: 1px solid var(--border-color);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-color);
      padding-top: 0.9rem;
      margin-top: 0.2rem;
      flex-wrap: wrap;
      gap: 4px;
    }
    .card-meta .stats {
      display: flex;
      gap: 12px;
    }
    .card-meta .stats span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-meta .stats i {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .risk-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .risk-safe {
      background: #064e3b;
      color: #6ee7b7;
    }
    .risk-low {
      background: #78350f;
      color: #fcd34d;
    }
    .risk-medium {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .risk-unknown {
      background: #1e293b;
      color: var(--text-muted);
    }

    .card-actions {
      margin-top: 0.75rem;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-actions a {
      color: var(--text-secondary);
      text-decoration: none;
      background: var(--bg-input);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.75rem;
      transition: var(--transition);
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .card-actions a:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-secondary);
      grid-column: 1/-1;
    }
    .empty-state i {
      font-size: 3rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .empty-state h3 {
      font-weight: 500;
      color: var(--text-primary);
    }

    .footer-note {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
    }
    .footer-note a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .shimmer {
      background: linear-gradient(90deg, var(--bg-input) 25%, var(--bg-hover) 50%, var(--bg-input) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 12px;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .loading-card {
      height: 220px;
      border-radius: var(--radius);
      background: var(--bg-card);
      padding: 1.5rem;
      border: 1px solid var(--border-color);
    }
    .loading-card .line {
      height: 12px;
      margin-bottom: 10px;
      border-radius: 40px;
      background: var(--bg-input);
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 40px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    @media (max-width: 640px) {
      .header { flex-direction: column; align-items: stretch; text-align: center; }
      .search-row { flex-direction: column; align-items: stretch; }
      .filter-row { flex-direction: column; align-items: stretch; }
      .filter-group { flex-wrap: wrap; }
      .script-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <header class="header">
    <div class="logo">
      <h1>📜 rscripts <span>· search</span></h1>
    </div>
    <div class="badge">
      <i class="fas fa-shield-alt"></i> Rscripts API · dark mode
    </div>
  </header>

  <!-- search + filters -->
  <div class="search-card">
    <div class="search-row">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search scripts, games, or creators…" value="autofarm" />
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" id="searchBtn"><i class="fas fa-arrow-right"></i> Search</button>
        <button class="btn btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset</button>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group">
        <label><i class="fas fa-filter"></i> Sort</label>
        <div class="sort-badge" id="sortGroup">
          <button class="active" data-sort="relevance">Relevance</button>
          <button data-sort="views">Views</button>
          <button data-sort="likes">Likes</button>
          <button data-sort="date">Date</button>
        </div>
      </div>
      <div class="filter-group">
        <label><i class="fas fa-shield-alt"></i> Risk</label>
        <select id="riskFilter">
          <option value="all">All</option>
          <option value="safe">Safe</option>
          <option value="low">Low</option>
          <option value="medium">Risk</option>
        </select>
      </div>
      <div class="filter-group">
        <label><i class="fas fa-list"></i> Per page</label>
        <select id="limitSelect">
          <option value="6">6</option>
          <option value="12" selected>12</option>
          <option value="24">24</option>
          <option value="48">48</option>
        </select>
      </div>
      <div style="margin-left:auto; font-size:0.8rem; color:var(--text-muted);">
        <i class="fas fa-code"></i> <span id="resultCount"></span>
      </div>
    </div>
  </div>

  <!-- results -->
  <div class="results-header">
    <h2>🔍 Scripts <small id="resultCountLabel"></small></h2>
    <span style="font-size:0.8rem; color:var(--text-muted);">
      <i class="fas fa-database"></i> <span id="totalResults">0</span> scripts
    </span>
  </div>

  <div id="scriptGrid" class="script-grid">
    <!-- rendered by JS -->
  </div>

  <div class="footer-note">
    <i class="fas fa-moon"></i> Dark mode · 
    <a href="https://api.rscripts.net/v1/search" target="_blank">Rscripts API</a> · 
    <a href="https://rscripts.net/docs/api" target="_blank">API docs</a>
  </div>
</div>

<script>
  (function() {
    // ---------- API KEY ----------
    const API_KEY = 'rsc_live_JelXNkd8gAbBqAKoM5p3tYSevOtkqdxC';
    const API_URL = 'https://api.rscripts.net/v1/search';

    // DOM refs
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scriptGrid = document.getElementById('scriptGrid');
    const resultCountLabel = document.getElementById('resultCountLabel');
    const totalResultsSpan = document.getElementById('totalResults');
    const riskFilter = document.getElementById('riskFilter');
    const limitSelect = document.getElementById('limitSelect');
    const sortGroup = document.getElementById('sortGroup');

    let currentQuery = 'autofarm';
    let currentSort = 'relevance';
    let currentRisk = 'all';
    let currentLimit = 12;
    let allScripts = [];
    let totalCount = 0;

    // ---------- helpers ----------
    function buildSearchUrl(query, limit) {
      const url = new URL(API_URL);
      url.searchParams.set('q', query.trim());
      url.searchParams.set('index', 'scripts');
      url.searchParams.set('limit', String(limit || currentLimit));
      url.searchParams.set('page', '1');
      return url.toString();
    }

    function getRiskBadge(risk) {
      if (!risk || risk.score === undefined) {
        return '<span class="risk-badge risk-unknown">unknown</span>';
      }
      const score = risk.score;
      if (score <= 2) return `<span class="risk-badge risk-safe">✓ Safe</span>`;
      if (score <= 4) return `<span class="risk-badge risk-low">⚠ Low</span>`;
      return `<span class="risk-badge risk-medium">🔶 Risk</span>`;
    }

    function getRiskLevel(risk) {
      if (!risk || risk.score === undefined) return 'unknown';
      const score = risk.score;
      if (score <= 2) return 'safe';
      if (score <= 4) return 'low';
      return 'medium';
    }

    function formatNum(n) {
      if (!n && n !== 0) return '0';
      if (n >= 1000) return (n/1000).toFixed(1) + 'k';
      return String(n);
    }

    function formatDate(ts) {
      if (!ts) return 'N/A';
      const d = new Date(ts);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // sort functions
    function sortScripts(scripts, sortBy) {
      const copy = [...scripts];
      switch(sortBy) {
        case 'views':
          return copy.sort((a, b) => (b.views || 0) - (a.views || 0));
        case 'likes':
          return copy.sort((a, b) => (b.likes || 0) - (a.likes || 0));
        case 'date':
          return copy.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        case 'relevance':
        default:
          return copy;
      }
    }

    function filterScripts(scripts, risk) {
      if (risk === 'all') return scripts;
      return scripts.filter(s => getRiskLevel(s.risk) === risk);
    }

    function renderScripts(scripts) {
      const filtered = filterScripts(scripts, currentRisk);
      const sorted = sortScripts(filtered, currentSort);

      if (sorted.length === 0) {
        scriptGrid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-box-open"></i>
            <h3>No scripts found</h3>
            <p style="color:var(--text-muted); margin-top:0.3rem;">Try adjusting your filters or search query.</p>
          </div>
        `;
        resultCountLabel.textContent = '(0)';
        totalResultsSpan.textContent = '0';
        return;
      }

      let html = '';
      sorted.forEach(script => {
        const title = script.title || 'Untitled';
        const gameTitle = script.game?.title || 'Roblox';
        const placeId = script.game?.placeId || '';
        const gameUrl = script.game?.robloxUrl || `https://www.roblox.com/games/${placeId}`;
        const desc = script.description || 'No description provided.';
        const views = formatNum(script.views);
        const likes = formatNum(script.likes);
        const rawUrl = script.rawScript || '#';
        const riskBadge = getRiskBadge(script.risk);
        const creator = script.creator?.username || 'unknown';
        const createdAt = formatDate(script.createdAt);
        const tags = script.tags || ['script'];

        html += `
          <div class="script-card">
            <div class="card-title">
              <i class="fas fa-file-code"></i>
              ${title}
            </div>
            <div class="card-game">
              <i class="fas fa-gamepad"></i>
              <a href="${gameUrl}" target="_blank">${gameTitle}</a>
              ${placeId ? `<span style="color:var(--text-muted);font-size:0.7rem;">#${placeId}</span>` : ''}
              <span style="color:var(--text-muted);font-size:0.65rem;">· ${createdAt}</span>
            </div>
            <div class="card-tags">
              ${tags.slice(0, 3).map(t => `<span class="tag">#${t}</span>`).join('')}
            </div>
            <div class="card-desc">${desc}</div>
            <div class="card-meta">
              <div class="stats">
                <span><i class="fas fa-eye"></i> ${views}</span>
                <span><i class="fas fa-thumbs-up"></i> ${likes}</span>
                <span><i class="fas fa-user"></i> ${creator}</span>
              </div>
              ${riskBadge}
            </div>
            <div class="card-actions">
              <a href="${rawUrl}" target="_blank"><i class="fas fa-scroll"></i> raw</a>
              ${script.game?.placeId ? `<a href="https://www.roblox.com/games/${script.game.placeId}" target="_blank"><i class="fas fa-gamepad"></i> play</a>` : ''}
            </div>
          </div>
        `;
      });

      scriptGrid.innerHTML = html;
      resultCountLabel.textContent = `(${sorted.length})`;
      totalResultsSpan.textContent = String(totalCount);
    }

    function showLoading() {
      resultCountLabel.textContent = '…';
      let loadingHtml = '';
      for (let i = 0; i < 6; i++) {
        loadingHtml += `
          <div class="loading-card">
            <div class="line shimmer" style="width:70%;"></div>
            <div class="line shimmer" style="width:40%;"></div>
            <div class="line shimmer" style="width:90%; margin-top:12px;"></div>
            <div class="line shimmer" style="width:50%; margin-top:12px;"></div>
          </div>
        `;
      }
      scriptGrid.innerHTML = loadingHtml;
    }

    async function performSearch(query) {
      if (!query || query.trim() === '') {
        scriptGrid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search" style="font-size:2rem;"></i>
            <h3>Enter a search term</h3>
            <p style="color:var(--text-muted);">e.g. "autofarm", "blox fruits", "inf yield"</p>
          </div>
        `;
        resultCountLabel.textContent = '';
        totalResultsSpan.textContent = '0';
        return;
      }

      currentQuery = query.trim();
      showLoading();

      try {
        const url = buildSearchUrl(currentQuery, currentLimit);
        const headers = {
          'Authorization': `Bearer ${API_KEY}`,
          'Accept': 'application/json',
        };

        const response = await fetch(url, { headers });
        if (!response.ok) {
          let errMsg = `API error ${response.status}`;
          try {
            const errJson = await response.json();
            if (errJson.error?.message) errMsg = errJson.error.message;
          } catch (_) {}
          throw new Error(errMsg);
        }

        const json = await response.json();
        if (json.success === false) {
          throw new Error(json.error?.message || 'Unknown API error');
        }

        const data = json.data || { scripts: [], meta: {} };
        allScripts = data.scripts || [];
        totalCount = data.meta?.pagination?.scripts?.total || 0;

        renderScripts(allScripts);
      } catch (err) {
        console.error('Search error:', err);
        scriptGrid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
            <h3>Something went wrong</h3>
            <p style="color:var(--text-muted); max-width:400px; margin:0 auto;">
              ${err.message || 'Could not fetch scripts. Check your API key or network.'}
            </p>
          </div>
        `;
        resultCountLabel.textContent = '⚠️ error';
        totalResultsSpan.textContent = '0';
      }
    }

    function updateFiltersAndRender() {
      if (allScripts.length > 0) {
        renderScripts(allScripts);
      } else if (currentQuery) {
        performSearch(currentQuery);
      }
    }

    // ---------- event binding ----------
    function handleSearch() {
      const query = searchInput.value.trim();
      performSearch(query);
    }

    searchBtn.addEventListener('click', handleSearch);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSearch();
      }
    });

    resetBtn.addEventListener('click', () => {
      searchInput.value = '';
      allScripts = [];
      totalCount = 0;
      performSearch('');
    });

    // sort buttons
    sortGroup.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn || !btn.dataset.sort) return;
      sortGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
      updateFiltersAndRender();
    });

    riskFilter.addEventListener('change', () => {
      currentRisk = riskFilter.value;
      updateFiltersAndRender();
    });

    limitSelect.addEventListener('change', () => {
      currentLimit = parseInt(limitSelect.value, 10);
      if (currentQuery) performSearch(currentQuery);
    });

    // ---------- initial load ----------
    setTimeout(() => {
      if (searchInput.value.trim()) {
        performSearch(searchInput.value.trim());
      } else {
        performSearch('autofarm');
      }
    }, 100);
  })();
</script>
</body>
</html>
